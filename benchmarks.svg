<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="Benchmarks">
<defs><linearGradient id="d" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><linearGradient id="u" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs>
<rect width="900" height="390" rx="16" fill="#0b0f1a"/>
<text x="40" y="46" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="url(#t)">Benchmarks</text>
<text x="40" y="68" font-family="'Courier New', monospace" font-size="13" fill="#9aa4d6">before vs after, measured on enterprise GenAI and data workloads</text>
<text x="40" y="120" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6e9f5">Hallucinated outputs</text>
<rect x="300" y="108" width="480" height="16" rx="8" fill="#151a2e"/>
<rect x="300" y="108" width="0" height="16" rx="8" fill="url(#d)"><animate attributeName="width" values="0;120.0;120.0;0" keyTimes="0;0.25;0.9;1" dur="8s" begin="0.0s" repeatCount="indefinite"/></rect>
<text x="796" y="121" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#22d3ee">-25%</text>
<text x="40" y="166" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6e9f5">AI response quality</text>
<rect x="300" y="154" width="480" height="16" rx="8" fill="#151a2e"/>
<rect x="300" y="154" width="0" height="16" rx="8" fill="url(#u)"><animate attributeName="width" values="0;96.0;96.0;0" keyTimes="0;0.25;0.9;1" dur="8s" begin="0.25s" repeatCount="indefinite"/></rect>
<text x="796" y="167" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#f472b6">+20%</text>
<text x="40" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6e9f5">GenAI API cost</text>
<rect x="300" y="200" width="480" height="16" rx="8" fill="#151a2e"/>
<rect x="300" y="200" width="0" height="16" rx="8" fill="url(#d)"><animate attributeName="width" values="0;72.0;72.0;0" keyTimes="0;0.25;0.9;1" dur="8s" begin="0.5s" repeatCount="indefinite"/></rect>
<text x="796" y="213" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#22d3ee">-15%</text>
<text x="40" y="258" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6e9f5">Information retrieval time</text>
<rect x="300" y="246" width="480" height="16" rx="8" fill="#151a2e"/>
<rect x="300" y="246" width="0" height="16" rx="8" fill="url(#d)"><animate attributeName="width" values="0;240.0;240.0;0" keyTimes="0;0.25;0.9;1" dur="8s" begin="0.75s" repeatCount="indefinite"/></rect>
<text x="796" y="259" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#22d3ee">-50%</text>
<text x="40" y="304" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6e9f5">Manual review effort</text>
