<rect x="300" y="292" width="0" height="16" rx="8" fill="url(#d)"><animate attributeName="width" values="0;192.0;192.0;0" keyTimes="0;0.25;0.9;1" dur="8s" begin="1.0s" repeatCount="indefinite"/></rect>
<text x="796" y="305" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#22d3ee">-40%</text>
<text x="40" y="350" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6e9f5">Report delivery time</text>
<rect x="300" y="338" width="480" height="16" rx="8" fill="#151a2e"/>
<rect x="300" y="338" width="0" height="16" rx="8" fill="url(#d)"><animate attributeName="width" values="0;408.0;408.0;0" keyTimes="0;0.25;0.9;1" dur="8s" begin="1.25s" repeatCount="indefinite"/></rect>
<text x="796" y="351" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#22d3ee">-85%</text>
