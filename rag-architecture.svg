<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="RAG architecture: ingest, retrieve, ground, generate, evaluate">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93c9"/>
    </marker>
  </defs>

  <rect width="1000" height="360" rx="16" fill="#0b0f1a"/>

  <text x="500" y="38" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="url(#accent)">Retrieval-Augmented Generation Pipeline</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#e6e9f5" text-anchor="middle">
    <rect x="30"  y="80" width="150" height="64" rx="10" fill="#151a2e" stroke="#22d3ee"/>
    <text x="105" y="108" font-weight="600">Enterprise Docs</text>
    <text x="105" y="128" fill="#9aa4d6" font-size="12">10,000+ documents</text>

    <rect x="250" y="80" width="150" height="64" rx="10" fill="#151a2e" stroke="#22d3ee"/>
    <text x="325" y="108" font-weight="600">Chunk + Clean</text>
    <text x="325" y="128" fill="#9aa4d6" font-size="12">Python preprocessing</text>

    <rect x="470" y="80" width="150" height="64" rx="10" fill="#151a2e" stroke="#22d3ee"/>
    <text x="545" y="108" font-weight="600">Embed</text>
    <text x="545" y="128" fill="#9aa4d6" font-size="12">embedding models</text>

    <rect x="690" y="80" width="150" height="64" rx="10" fill="#151a2e" stroke="#a78bfa"/>
    <text x="765" y="108" font-weight="600">Vector Store</text>
    <text x="765" y="128" fill="#9aa4d6" font-size="12">FAISS · Pinecone</text>
  </g>
  <g stroke="#8b93c9" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/>
    <line x1="180" y1="112" x2="248" y2="112"/>
    <line x1="400" y1="112" x2="468" y2="112"/>
    <line x1="620" y1="112" x2="688" y2="112"/>
  </g>
  <text x="105" y="170" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#22d3ee" font-weight="600">INGEST (offline)</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#e6e9f5" text-anchor="middle">
    <rect x="30"  y="210" width="150" height="64" rx="10" fill="#151a2e" stroke="#a78bfa"/>
    <text x="105" y="238" font-weight="600">User Question</text>
    <text x="105" y="258" fill="#9aa4d6" font-size="12">support / engineering</text>

    <rect x="250" y="210" width="150" height="64" rx="10" fill="#151a2e" stroke="#a78bfa"/>
    <text x="325" y="238" font-weight="600">Semantic Retrieve</text>
    <text x="325" y="258" fill="#9aa4d6" font-size="12">top-k similar chunks</text>

    <rect x="470" y="210" width="150" height="64" rx="10" fill="#151a2e" stroke="#a78bfa"/>
    <text x="545" y="238" font-weight="600">Ground Prompt</text>
    <text x="545" y="258" fill="#9aa4d6" font-size="12">context + guardrails</text>

    <rect x="690" y="210" width="150" height="64" rx="10" fill="#151a2e" stroke="#22d3ee"/>
    <text x="765" y="238" font-weight="600">LLM Generate</text>
    <text x="765" y="258" fill="#9aa4d6" font-size="12">grounded answers</text>

    <rect x="880" y="210" width="95" height="64" rx="10" fill="#151a2e" stroke="#22d3ee"/>
    <text x="927" y="248" font-weight="600">Answer</text>
  </g>
  <g stroke="#8b93c9" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/>
    <line x1="180" y1="242" x2="248" y2="242"/>
    <line x1="400" y1="242" x2="468" y2="242"/>
    <line x1="620" y1="242" x2="688" y2="242"/>
    <line x1="840" y1="242" x2="878" y2="242"/>
  </g>
  <path d="M765 144 L765 176 L325 176 L325 208" stroke="#8b93c9" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="560" y="170" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9aa4d6">similarity search</text>
  <text x="105" y="300" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a78bfa" font-weight="600">QUERY (online)</text>

  <rect x="30" y="316" width="945" height="30" rx="8" fill="#151a2e" stroke="url(#accent)" stroke-dasharray="6 4"/>
  <text x="502" y="336" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6e9f5">Evals on every change: hallucination rate · answer relevance · latency · cost</text>
</svg>
